<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Lista de Clientes</h2>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <a href="/clientes/novo" class="btn btn-primary mb-3">Novo Cliente</a>
    <a href="/agendamentos" class="btn btn-secondary mb-3">Ir para Agendamentos</a>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th>Cidade</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.nome}"></td>
                <td th:text="${c.email}"></td>
                <td th:text="${c.telefone}"></td>
                <td th:text="${c.endereco != null ? c.endereco.cidade : ''}"></td>
                <td>
                    <a th:href="@{/clientes/excluir/{id}(id=${c.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Confirma a exclusão?')">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
