<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Serviço</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Cadastrar Serviço</h2>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form th:action="@{/servicos}" th:object="${servico}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Nome do Serviço</label>
            <input type="text" class="form-control" th:field="*{nome}" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Valor (R$)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{valor}" required />
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/servicos" class="btn btn-secondary">Voltar</a>
    </form>
</body>
</html>
