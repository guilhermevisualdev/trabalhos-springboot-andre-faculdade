<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agendamentos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Agendamentos de Serviços</h2>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <a href="/agendamentos/novo" class="btn btn-primary mb-3">Novo Agendamento</a>
    <a href="/clientes" class="btn btn-outline-secondary mb-3">Gerenciar Clientes</a>
    <a href="/servicos" class="btn btn-outline-secondary mb-3">Gerenciar Serviços</a>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Serviço</th>
                <th>Usuário</th>
                <th>Data / Hora</th>
                <th>Descrição</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="a : ${agendamentos}">
                <td th:text="${a.id}"></td>
                <td th:text="${a.cliente != null ? a.cliente.nome : ''}"></td>
                <td th:text="${a.servico != null ? a.servico.nome : ''}"></td>
                <td th:text="${a.usuario != null ? a.usuario.usuario : ''}"></td>
                <td th:text="${#temporals.format(a.data, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${a.descricao}"></td>
                <td>
                    <a th:href="@{/agendamentos/excluir/{id}(id=${a.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Cancelar agendamento?')">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
