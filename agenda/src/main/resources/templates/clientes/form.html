<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Cliente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Cadastrar Cliente</h2>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form th:action="@{/clientes}" th:object="${cliente}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" th:field="*{nome}" required />
        </div>

        <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-control" th:field="*{email}" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input type="text" class="form-control" th:field="*{telefone}" />
        </div>

        <h5>Endereço</h5>
        <div class="row">
            <div class="col-md-8 mb-3">
                <label class="form-label">Logradouro</label>
                <input type="text" class="form-control" th:field="*{endereco.logradouro}" />
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Número</label>
                <input type="text" class="form-control" th:field="*{endereco.numero}" />
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Cidade</label>
                <input type="text" class="form-control" th:field="*{endereco.cidade}" />
            </div>
            <div class="col-md-2 mb-3">
                <label class="form-label">UF</label>
                <input type="text" class="form-control" th:field="*{endereco.uf}" />
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">CEP</label>
                <input type="text" class="form-control" th:field="*{endereco.cep}" />
            </div>
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/clientes" class="btn btn-secondary">Voltar</a>
    </form>
</body>
</html>
