<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Serviços</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Lista de Serviços</h2>
    
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <a href="/servicos/novo" class="btn btn-primary mb-3">Novo Serviço</a>
    <a href="/agendamentos" class="btn btn-secondary mb-3">Ir para Agendamentos</a>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Valor (R$)</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s : ${servicos}">
                <td th:text="${s.id}"></td>
                <td th:text="${s.nome}"></td>
                <td th:text="${s.valor}"></td>
                <td>
                    <a th:href="@{/servicos/excluir/{id}(id=${s.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Confirma a exclusão?')">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
